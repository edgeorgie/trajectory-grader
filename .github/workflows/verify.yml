name: verify

# Single required status check for this repo. The job name below ("verify")
# is what branch protection requires on main, so renaming it would silently
# un-gate the branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the declared requires-python; upper bound catches
        # deprecations early. Both must pass.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "ruff==0.17.0" "mypy==2.4.0" build

      # `scripts/` is linted and format-checked alongside src/tests on purpose:
      # scripts/to_canonical.py is executed by the "CLI contract" step below, so
      # it is CI-load-bearing code, not a loose helper. Omitting it here would
      # contradict both pyproject.toml's `src = [...]` and the README's
      # reproduce-CI-locally command.
      - name: Lint (ruff check)
        run: ruff check src tests scripts

      - name: Format check (ruff format)
        run: ruff format --check src tests scripts

      - name: Typecheck (mypy)
        run: mypy src

      - name: Tests (pytest)
        run: pytest -q

      - name: CLI contract — help exits 0
        run: python -m trajectory_grader.cli --help

      - name: CLI contract — real example trajectory is gradeable
        # Exercises the adapter + grader over the committed real triage-desk
        # run log, not a synthetic fixture. Exit 1 (violations found) is a
        # legitimate outcome here; only exit 2 (unreadable/malformed input)
        # or a crash is a failure.
        run: |
          python scripts/to_canonical.py examples/subject-under-test/triage-desk-run-issue24.json > canonical.json
          set +e
          python -m trajectory_grader.cli canonical.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then echo "CLI failed with exit $rc on a real example"; exit 1; fi
          echo "CLI graded the real example trajectory, exit $rc (0=clean, 1=violations)"

      - name: Calibration contract — gold set loads and agreement is reportable
        # Guards the hand-written gold set: a typo in a label JSON must fail
        # here rather than silently skewing a published agreement number.
        # Exit 0 is required because the gold set is non-empty — `calibrate`
        # exits 2 on an empty gold set, so this step also catches the gold
        # set being accidentally emptied.
        run: python -m trajectory_grader.calibrate gold-set/ examples/subject-under-test/

      - name: Build wheel
        run: python -m build --wheel --outdir dist

      - name: Confirm wheel imports from a clean environment
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl
          /tmp/wheelcheck/bin/python -c "import trajectory_grader, trajectory_grader.cli, trajectory_grader.calibrate; print('wheel import ok')"
